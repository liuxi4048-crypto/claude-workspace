# Pocket LLM を GitHub Pages にデプロイする(gh-pages ブランチ方式)
# gh-pages ブランチへの push で GitHub が Pages を自動有効化するため手動設定は不要
name: Deploy Pocket LLM to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'application/pocket-llm/**'
      - '.github/workflows/deploy-pocket-llm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/pocket-llm/package-lock.json
      - name: Build
        working-directory: application/pocket-llm
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble Pages site (pocket-llm をサブパスに配置)
        run: |
          mkdir -p _site/pocket-llm
          cp -r application/pocket-llm/dist/* _site/pocket-llm/
          # Pages 側で Jekyll 処理をさせない
          touch _site/.nojekyll
          # ルートアクセス時は pocket-llm へリダイレクト
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./pocket-llm/">
          <a href="./pocket-llm/">Pocket LLM を開く</a>
          EOF
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
